[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-instability-radiomics"
version = "1.0.0"
description = "Analysis code for: Tumor segmentation induces individual-level instability in radiomic risk classification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Pinned versions used for the paper are in requirements.txt; install them first:
#   pip install -r requirements.txt && pip install -e .

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
